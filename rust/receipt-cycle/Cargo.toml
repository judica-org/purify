[package]
name = "purify-receipt-cycle"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
bulletproofs-cycle = { version = "=0.4.1" }
ff = { version = "0.13", default-features = false }
golden-halo2curves = { version = "=0.4.1" }
merlin = { version = "3", default-features = false }
nova-snark = { git = "https://github.com/JeremyRubin/Nova", rev = "1ab4f4b6d3bbc95044770d6fb1736f5dd37f4048", version = "=0.76.0", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false }
num-traits = { version = "=0.2.19", default-features = false }
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
